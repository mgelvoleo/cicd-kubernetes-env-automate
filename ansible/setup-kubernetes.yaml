---
  - name: Prepare Kubernetes nodes and install container runtime + Kubernetes tools
    hosts: all
    become: true
    tasks:
      # -------------------------------
      # STEP 1: System prerequisites
      # -------------------------------
      - name: Disable swap
        command: swapoff -a
  
      - name: Comment out swap entries in /etc/fstab
        replace:
          path: /etc/fstab
          regexp: '^([^#].*\sswap\s.*)$'
          replace: '#\1'
  
      - name: Load required kernel modules config
        copy:
          dest: /etc/modules-load.d/k8s.conf
          content: |
            overlay
            br_netfilter
  
      - name: Load kernel modules immediately
        modprobe:
          name: "{{ item }}"
          state: present
        loop:
          - overlay
          - br_netfilter
  
      - name: Configure sysctl for Kubernetes networking
        copy:
          dest: /etc/sysctl.d/k8s.conf
          content: |
            net.bridge.bridge-nf-call-iptables  = 1
            net.bridge.bridge-nf-call-ip6tables = 1
            net.ipv4.ip_forward                 = 1
  
      - name: Apply sysctl parameters
        command: sysctl --system
  
      # -------------------------------
      # STEP 2: Install dependencies
      # -------------------------------
      - name: Install required packages
        apt:
          name:
            - curl
            - tar
            - apt-transport-https
            - ca-certificates
            - gpg
          state: present
          update_cache: yes
  
      # -------------------------------
      # STEP 3: Install runc
      # -------------------------------
      - name: Download runc binary
        get_url:
          url: "https://github.com/opencontainers/runc/releases/download/v1.1.12/runc.amd64"
          dest: /tmp/runc.amd64
          mode: '0755'
  
      - name: Install runc
        command: install -m 755 /tmp/runc.amd64 /usr/local/sbin/runc
        args:
          creates: /usr/local/sbin/runc
  
      # -------------------------------
      # STEP 4: Install containerd runtime
      # -------------------------------
      - name: Download containerd binary
        get_url:
          url: "https://github.com/containerd/containerd/releases/download/v1.7.14/containerd-1.7.14-linux-amd64.tar.gz"
          dest: /tmp/containerd-1.7.14-linux-amd64.tar.gz
          mode: '0644'
  
      - name: Extract containerd binary to /usr/local
        unarchive:
          src: /tmp/containerd-1.7.14-linux-amd64.tar.gz
          dest: /usr/local
          remote_src: yes
  
      - name: Create directories for containerd service
        file:
          path: /usr/local/lib/systemd/system
          state: directory
          mode: '0755'
  
      - name: Download containerd service file
        get_url:
          url: "https://raw.githubusercontent.com/containerd/containerd/main/containerd.service"
          dest: /usr/local/lib/systemd/system/containerd.service
          mode: '0644'
  
      - name: Create containerd config directory
        file:
          path: /etc/containerd
          state: directory
          mode: '0755'
  
      - name: Generate default containerd configuration
        shell: "containerd config default | tee /etc/containerd/config.toml"
        args:
          creates: /etc/containerd/config.toml
  
      - name: Enable SystemdCgroup in containerd config
        replace:
          path: /etc/containerd/config.toml
          regexp: '^(\s*SystemdCgroup\s*=\s*)false'
          replace: '\1true'
  
      - name: Reload systemd and enable containerd
        systemd:
          daemon_reload: yes
          name: containerd
          enabled: yes
          state: started
  
      # -------------------------------
      # STEP 5: Install crictl
      # -------------------------------
      - name: Download crictl tarball
        get_url:
          url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.29.0/crictl-v1.29.0-linux-amd64.tar.gz"
          dest: /tmp/crictl-v1.29.0-linux-amd64.tar.gz
          mode: '0644'
  
      - name: Extract crictl binary
        unarchive:
          src: /tmp/crictl-v1.29.0-linux-amd64.tar.gz
          dest: /usr/local/bin
          remote_src: yes
  
      - name: Configure crictl to use containerd
        copy:
          dest: /etc/crictl.yaml
          content: |
            runtime-endpoint: unix:///var/run/containerd/containerd.sock
            image-endpoint: unix:///var/run/containerd/containerd.sock
            timeout: 10
            debug: false
          mode: '0644'
  
      # -------------------------------
      # STEP 6: Install Kubernetes components
      # -------------------------------
      - name: Add Kubernetes APT repository GPG key
        shell: |
          curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key | \
          gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        args:
          creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  
      - name: Add Kubernetes APT repository
        copy:
          dest: /etc/apt/sources.list.d/kubernetes.list
          content: |
            deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /
  
      - name: Update apt cache after adding Kubernetes repo
        apt:
          update_cache: yes
  
      - name: Install kubelet, kubeadm, and kubectl
        shell: |
          apt-get install -y kubelet=1.29.6-1.1 kubeadm=1.29.6-1.1 kubectl=1.29.6-1.1 \
          --allow-downgrades --allow-change-held-packages
  
      - name: Hold Kubernetes packages at current version
        command: apt-mark hold kubelet kubeadm kubectl
  
  # --------------------------------------------------------------------
  # MASTER NODE SETUP
  # --------------------------------------------------------------------
  - name: Initialize Kubernetes master node
    hosts: master
    become: true
    tasks:
      - name: Initialize kubeadm
        shell: |
          kubeadm init --pod-network-cidr=10.244.0.0/16 \
          --apiserver-advertise-address=$(hostname -I | awk '{print $2}') --node-name master
        args:
          creates: /etc/kubernetes/admin.conf
        register: kubeadm_init
  
      - name: Save join command for worker nodes
        shell: kubeadm token create --print-join-command
        register: join_cmd
  
      - name: Save join command locally (controller)
        delegate_to: localhost
        copy:
          dest: ./join-command.sh
          content: "{{ join_cmd.stdout }}"
          mode: '0755'
  
      - name: Setup kubectl for root
        shell: |
          mkdir -p $HOME/.kube
          cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
          chown $(id -u):$(id -g) $HOME/.kube/config
  
      - name: Install flannel CNI plugin
        shell: |
          kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
        environment:
          KUBECONFIG: /etc/kubernetes/admin.conf
  
      - name: Show join command
        debug:
          var: join_cmd.stdout
  
  
  # --------------------------------------------------------------------
  # WORKER NODE SETUP
  # --------------------------------------------------------------------
  - name: Join worker nodes to Kubernetes cluster
    hosts: workers
    become: true
    tasks:
      - name: Copy join command from controller to workers
        copy:
          src: ./join-command.sh
          dest: /tmp/join-command.sh
          mode: '0755'
  
      - name: Join the node to the cluster
        shell: bash /tmp/join-command.sh
        args:
          creates: /etc/kubernetes/kubelet.conf
